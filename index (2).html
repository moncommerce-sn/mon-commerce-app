<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon commerce</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef3ef;--ink:#14231c;--mut:#5d6f65;--ac:#1f6b4a;--oc:#e0a82e;--rd:#c2412d;--ln:#d3ddd6}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:70px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px}h2{font-size:1.1rem;margin:20px 0 8px}
#au{padding:60px 20px;max-width:420px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--ac);color:#fff}
main{padding:14px 16px;max-width:560px;margin:auto}
input,select{width:100%;padding:12px;margin:4px 0 10px;border:1.5px solid var(--ln);border-radius:8px;font:inherit;background:#fff}
label{font-size:.9rem;color:var(--mut);display:block}
button{font:inherit;cursor:pointer}
.go{width:100%;padding:14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;margin-top:6px}
.alt{padding:12px 14px;border:1.5px solid var(--ac);border-radius:8px;background:#fff;color:var(--ac);font-weight:600}
#au .alt{width:100%;margin-top:8px}.sm{padding:6px 12px;font-size:.85rem}
.bar{display:flex;gap:8px}.bar input{margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;padding:12px;margin-bottom:6px;background:#fff;border:1px solid var(--ln);border-radius:8px;color:var(--ink)}
.row.col{flex-direction:column;align-items:flex-start;gap:2px}
.q{width:32px;height:32px;border:1.5px solid var(--ln);border-radius:50%;background:#fff;font-size:1.1rem}
.mut{color:var(--mut);font-size:.9rem}.low{color:var(--rd);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln)}
nav button{flex:1;padding:16px 0;border:0;background:none;color:var(--mut);font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--oc)}
#t{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
#cam{position:fixed;inset:0;background:#000;z-index:8;display:flex;flex-direction:column;padding:16px;gap:12px}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:8px}
.day{font-size:1.6rem;font-weight:800;color:var(--ac)}
</style></head><body>
<div id="t"></div>
<div id="cam" hidden><video id="vid" playsinline muted></video><button class="go" onclick="closeCam()">Fermer la caméra</button></div>
<section id="au"><h1>Mon commerce</h1><p class="mut">Connecte-toi pour gérer ta boutique.</p>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)">
<button class="go" onclick="auth(false)">Se connecter</button><button class="alt" onclick="auth(true)">Créer mon compte</button></section>
<div id="ap" hidden>
<header><b>Mon commerce</b><button class="alt sm" onclick="sb.auth.signOut().then(start)">Sortir</button></header>
<main>
<section id="s-vente"><div class="bar"><input id="q" oninput="rv()" placeholder="Nom ou code-barres"><button class="alt" style="height:46px" onclick="scan('q')">Scanner</button></div>
<div id="res"></div><h2>Panier</h2><div id="cart"></div>
<div class="row"><b>Total</b><b id="tot">0 F</b></div>
<label>Montant reçu<input id="paid" type="number" inputmode="numeric"></label>
<label>Paiement<select id="pay"><option>Espèces</option><option>Wave</option><option>Orange Money</option></select></label>
<button class="go" onclick="sell()">Valider la vente</button></section>
<section id="s-stock" hidden><h2>Ajouter un produit</h2>
<input id="pn" placeholder="Nom du produit"><div class="bar"><input id="pc" placeholder="Code-barres (facultatif)"><button class="alt" style="height:46px" onclick="scan('pc')">Scanner</button></div>
<input id="pa" type="number" inputmode="numeric" placeholder="Prix d'achat"><input id="pv" type="number" inputmode="numeric" placeholder="Prix de vente"><input id="ps" type="number" inputmode="numeric" placeholder="Quantité en stock">
<button class="go" onclick="addP()">Ajouter le produit</button>
<h2>Mon stock</h2><input id="sq" oninput="rs()" placeholder="Chercher un produit"><div id="list"></div></section>
<section id="s-hist" hidden><h2>Aujourd'hui</h2><div class="day" id="day">0 F</div><h2>Dernières ventes</h2><div id="hl"></div></section>
</main>
<nav><button id="n-vente" onclick="show('vente')">Vente</button><button id="n-stock" onclick="show('stock')">Stock</button><button id="n-hist" onclick="show('hist')">Historique</button></nav>
</div>
<script>
const sb=supabase.createClient("https://kqfhbxzcixcdcjcsvkla.supabase.co","sb_publishable_gmcnPJ8EOrK0pcEnSZIH8w_FY_65XvF");
const $=i=>document.getElementById(i),F=n=>Math.round(n).toLocaleString("fr-FR")+" F";
let P=[],C={},stream,stop=false;
function msg(t){const e=$("t");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,3000)}
async function auth(up){const email=$("em").value.trim(),password=$("pw").value;
 const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return msg(r.error.message);
 if(!r.data.session)return msg("Compte créé. Confirme ton email, puis connecte-toi.");
 start()}
async function start(){const {data}=await sb.auth.getSession(),ok=!!data.session;
 $("au").hidden=ok;$("ap").hidden=!ok;if(ok){await load();show("vente")}}
async function load(){const {data,error}=await sb.from("produits").select("*").order("nom");if(error)return msg(error.message);P=data}
function show(t){["vente","stock","hist"].forEach(x=>{$("s-"+x).hidden=x!=t;$("n-"+x).classList.toggle("on",x==t)});({vente:rv,stock:rs,hist:rh})[t]()}
const pr=p=>+p.prix_vente||0,tot=()=>Object.entries(C).reduce((s,[id,n])=>s+n*pr(P.find(x=>x.id==id)),0);
function find(q){q=q.toLowerCase();return P.filter(p=>p.nom.toLowerCase().includes(q)||(p.code_barres||"")==q)}
function rv(){const q=$("q").value.trim();
 $("res").innerHTML=q?find(q).slice(0,8).map(p=>`<button class="row" onclick="add('${p.id}')"><b>${p.nom}</b><span>${F(pr(p))} · stock ${p.stock}</span></button>`).join("")||'<p class="mut">Aucun produit. Ajoute-le dans Stock.</p>':"";
 const L=Object.entries(C);
 $("cart").innerHTML=L.length?L.map(([id,n])=>{const p=P.find(x=>x.id==id);return `<div class="row"><b>${p.nom}</b><span><button class="q" onclick="chg('${id}',-1)">−</button> ${n} <button class="q" onclick="chg('${id}',1)">+</button> ${F(n*pr(p))}</span></div>`}).join(""):'<p class="mut">Panier vide. Cherche ou scanne un produit.</p>';
 $("tot").textContent=F(tot())}
function add(id){C[id]=(C[id]||0)+1;$("q").value="";rv();$("paid").value=tot()}
function chg(id,d){C[id]+=d;if(C[id]<=0)delete C[id];rv();$("paid").value=tot()}
async function sell(){const L=Object.entries(C);if(!L.length)return msg("Ajoute d'abord un produit");
 const T=tot(),paid=+$("paid").value||0;
 const {data:v,error}=await sb.from("ventes").insert({moyen_paiement:$("pay").value,montant_total:T,montant_paye:paid}).select().single();
 if(error)return msg(error.message);
 const rows=L.map(([id,n])=>{const p=P.find(x=>x.id==id);return{vente_id:v.id,produit_id:id,produit_nom:p.nom,quantite:n,prix_achat:p.prix_achat,prix_vente:pr(p)}});
 const r=await sb.from("vente_lignes").insert(rows);if(r.error)return msg(r.error.message);
 for(const [id,n] of L){const p=P.find(x=>x.id==id);await sb.from("produits").update({stock:p.stock-n}).eq("id",id)}
 C={};await load();rv();$("paid").value="";msg(paid<T?"Vente enregistrée. Reste à payer : "+F(T-paid):"Vente enregistrée")}
function rs(){const q=$("sq").value.trim().toLowerCase();
 $("list").innerHTML=P.filter(p=>!q||p.nom.toLowerCase().includes(q)||(p.code_barres||"")==q).map(p=>`<button class="row" onclick="setStock('${p.id}')"><b>${p.nom}</b><span class="${p.stock<=p.stock_alerte?"low":""}">stock ${p.stock} · ${F(pr(p))}</span></button>`).join("")||'<p class="mut">Aucun produit pour le moment.</p>'}
async function setStock(id){const p=P.find(x=>x.id==id),v=prompt(p.nom+" : nouveau stock",p.stock);if(v===null||isNaN(+v))return;
 await sb.from("produits").update({stock:+v}).eq("id",id);await load();rs()}
async function addP(){const g=i=>$(i).value.trim();if(!g("pn"))return msg("Écris le nom du produit");
 const {error}=await sb.from("produits").insert({nom:g("pn"),code_barres:g("pc")||null,prix_achat:+g("pa")||0,prix_vente:+g("pv")||0,stock:+g("ps")||0});
 if(error)return msg(error.code=="42703"||/prix_vente/.test(error.message)?"Ajoute d'abord la colonne prix_vente dans Supabase":error.message);
 ["pn","pc","pa","pv","ps"].forEach(i=>$(i).value="");await load();rs();msg("Produit ajouté")}
async function rh(){const {data,error}=await sb.from("ventes").select("*,vente_lignes(produit_nom,quantite,marge)").order("created_at",{ascending:false}).limit(50);
 if(error)return msg(error.message);
 $("hl").innerHTML=data.map(v=>`<div class="row col"><span><b>${F(v.montant_total)}</b> · ${v.moyen_paiement}</span><span class="mut">${new Date(v.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}${v.montant_paye<v.montant_total?` · <b class="low">reste ${F(v.montant_total-v.montant_paye)}</b>`:""}</span><span class="mut">${v.vente_lignes.map(l=>l.quantite+"× "+l.produit_nom).join(", ")}</span></div>`).join("")||'<p class="mut">Aucune vente pour le moment.</p>';
 const d=new Date().toDateString(),j=data.filter(v=>new Date(v.created_at).toDateString()==d);
 $("day").textContent=F(j.reduce((s,v)=>s+ +v.montant_total,0))+" · marge "+F(j.reduce((s,v)=>s+v.vente_lignes.reduce((a,l)=>a+ +l.marge,0),0))}
async function scan(target){
 if(!("BarcodeDetector" in window))return msg("Scan indisponible sur ce navigateur : tape le code");
 const d=new BarcodeDetector(),v=$("vid");
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("cam").hidden=false;stop=false;v.srcObject=stream;await v.play()}catch(e){return msg("Caméra refusée")}
 while(!stop){const r=await d.detect(v).catch(()=>[]);
  if(r.length){const c=r[0].rawValue;closeCam();
   if(target=="pc")$("pc").value=c;else{$("q").value=c;const f=find(c);f.length==1?add(f[0].id):rv()}return}
  await new Promise(r=>setTimeout(r,300))}}
function closeCam(){stop=true;stream&&stream.getTracks().forEach(t=>t.stop());$("cam").hidden=true}
start();
</script></body></html>
