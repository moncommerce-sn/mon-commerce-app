<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Mon commerce</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eff5f0;--ink:#12261d;--mut:#5c7065;--g:#14513c;--a:#e8a117;--r:#b8452a;--ln:#d9e3dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 Roboto,system-ui,sans-serif}
.w{max-width:600px;margin:auto;padding:20px 16px}
h1{font-size:2rem;margin:8px 0 2px}.sub{color:var(--mut);margin:0 0 18px}
h2{font-size:1.2rem;margin:24px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:20px 12px;text-align:center}
.st span{display:block;color:var(--mut);font-size:.95rem}
.st b{display:block;font-size:1.9rem;font-weight:800;margin-top:6px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;font:inherit;font-weight:700;background:var(--g);color:#fff;margin-top:20px;cursor:pointer;text-align:center;text-decoration:none}
.err{background:#fff;border:1px solid var(--r);color:var(--r);border-radius:16px;padding:16px;font-weight:600}
</style></head><body>
<div class="w">
<h1>Admin</h1><p class="sub">Statistiques de Mon commerce, totaux seulement</p>
<div id="out"><p class="sub">Chargement…</p></div>
<button class="btn" onclick="charger()">Actualiser</button>
<a class="btn" style="background:#fff;color:var(--g);border:1.5px solid var(--g)" href="./">Retour à l'application</a>
</div>
<script>
const sb=supabase.createClient("https://kqfhbxzcixcdcjcsvkla.supabase.co","sb_publishable_gmcnPJ8EOrK0pcEnSZIH8w_FY_65XvF");
const $=i=>document.getElementById(i),N=n=>(+n||0).toLocaleString("fr-FR");
const c=(a,b)=>`<div class="st"><span>${a}</span><b>${N(b)}</b></div>`;
async function charger(){
 $("out").innerHTML='<p class="sub">Chargement…</p>';
 const {data:s}=await sb.auth.getSession();
 if(!s.session){$("out").innerHTML='<div class="err">Tu n\'es pas connecté. Ouvre d\'abord l\'application, connecte-toi avec ton compte, puis reviens sur cette page.</div>';return}
 const {data,error}=await sb.rpc("stats_admin");
 if(error){$("out").innerHTML='<div class="err">'+(error.message.includes("Non autoris")?"Ce compte n\'est pas administrateur.":error.message)+'</div>';return}
 $("out").innerHTML=
 '<h2>Inscrits</h2><div class="g2">'+c("Utilisateurs",data.utilisateurs)+c("Commerces",data.commerces)+c("Vendeurs",data.vendeurs)+c("Produits",data.produits)+'</div>'+
 '<h2>Ventes enregistrées</h2><div class="g2">'+c("Aujourd'hui",data.ventes_aujourdhui)+c("7 derniers jours",data.ventes_7j)+c("30 derniers jours",data.ventes_30j)+c("Total",data.ventes_total)+'</div>'+
 '<h2>Commerces actifs (au moins une vente)</h2><div class="g2">'+c("7 derniers jours",data.commerces_actifs_7j)+c("30 derniers jours",data.commerces_actifs_30j)+'</div>'}
charger();
document.title="Admin · TAÏF Marchand";
document.querySelector(".sub").textContent="Statistiques de TAÏF Marchand, totaux seulement";
(function(){
  const box=document.createElement("div");
  box.id="bq";
  document.getElementById("out").after(box);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const jour=d=>d?new Date(d).toLocaleDateString("fr-FR"):"-";
  const lab={abonne:"Abonné",essai:"Essai gratuit",expire:"Expiré"};
  const col={abonne:"#1f7a4d",essai:"#e8a117",expire:"#b8452a"};
  async function boutiques(){
    const {data:s}=await sb.auth.getSession();
    if(!s.session){box.innerHTML="";return;}
    const {data,error}=await sb.rpc("admin_boutiques");
    if(error||!data){box.innerHTML="";return;}
    const n=k=>data.filter(b=>b.statut===k).length;
    let h='<h2>Boutiques ('+data.length+')</h2><p class="sub">'+n("abonne")+' abonnée(s), '+n("essai")+' en essai, '+n("expire")+' expirée(s)</p>';
    data.forEach(b=>{
      const fin=b.statut==="essai"?b.essai_fin:b.abonnement_fin;
      h+='<div style="background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>'+esc(b.nom)+'</b>'
        +'<span style="color:'+col[b.statut]+';font-weight:700">'+lab[b.statut]+'</span></div>'
        +'<div class="sub" style="margin:6px 0 0">'+esc(b.email_patron)+(b.phone?' · '+esc(b.phone):'')+'</div>'
        +'<div style="margin-top:8px;font-size:.95rem">Fin : '+jour(fin)+(b.plan?' · Offre : '+esc(b.plan):'')+'</div>'
        +'<div style="font-size:.95rem">Vendeurs : '+b.nb_vendeurs+' · Payé : '+Number(b.total_paye).toLocaleString("fr-FR")+' FCFA</div>'
        +'</div>';
    });
    box.innerHTML=h;
  }
  const charger0=charger;
  charger=async function(){await charger0();await boutiques();};
  boutiques();
})();
(function(){
  const box=document.getElementById("bq");
  async function boutons(){
    const {data,error}=await sb.rpc("admin_boutiques");
    if(error||!data)return false;
    const cards=[...box.children].filter(e=>e.tagName==="DIV");
    if(cards.length!==data.length)return false;
    cards.forEach((c,i)=>{
      if(c.querySelector(".act"))return;
      const b=data[i];
      const w=document.createElement("div");
      w.className="act";
      w.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px";
      [1,3,6,12].forEach(m=>{
        const x=document.createElement("button");
        x.textContent="+"+m+" mois";
        x.style.cssText="padding:12px;border:1.5px solid #14513c;border-radius:12px;background:#fff;color:#14513c;font:inherit;font-weight:700";
        x.onclick=async()=>{
          if(!confirm("Activer +"+m+" mois pour « "+b.nom+" » ?"))return;
          const {data:r,error:e}=await sb.rpc("admin_activer",{p_shop:b.id,p_mois:m});
          if(e)return alert("Erreur : "+e.message);
          alert("Abonnement actif jusqu'au "+new Date(r).toLocaleDateString("fr-FR"));
          charger();
        };
        w.appendChild(x);
      });
      c.appendChild(w);
    });
    return true;
  }
  const charger1=charger;
  charger=async function(){await charger1();await boutons();};
  let n=0;
  const t=setInterval(async()=>{n++;if(await boutons()||n>12)clearInterval(t);},500);
})();
(function(){
  const box=document.getElementById("bq");
  async function suspension(){
    const {data,error}=await sb.rpc("admin_boutiques");
    if(error||!data)return false;
    const cards=[...box.children].filter(e=>e.tagName==="DIV");
    if(cards.length!==data.length)return false;
    cards.forEach((c,i)=>{
      const b=data[i];
      if(c.querySelector(".sus"))return;
      const w=document.createElement("div");
      w.className="sus";
      w.style.cssText="margin-top:10px";
      if(b.suspendu){
        const t=document.createElement("div");
        t.style.cssText="color:#b8452a;font-weight:700;margin-bottom:8px";
        t.textContent="SUSPENDU"+(b.suspendu_motif?" · "+b.suspendu_motif:"");
        w.appendChild(t);
      }
      const x=document.createElement("button");
      x.textContent=b.suspendu?"Réactiver ce compte":"Suspendre ce compte";
      x.style.cssText="width:100%;padding:12px;border:1.5px solid #b8452a;border-radius:12px;background:#fff;color:#b8452a;font:inherit;font-weight:700";
      x.onclick=async()=>{
        let motif=null;
        if(!b.suspendu){
          motif=prompt("Motif de la suspension (affiché au commerçant) :","Abonnement non réglé");
          if(motif===null)return;
        }else if(!confirm("Réactiver « "+b.nom+" » ?"))return;
        const {error:e}=await sb.rpc("admin_suspendre",{p_shop:b.id,p_suspendre:!b.suspendu,p_motif:motif});
        if(e)return alert("Erreur : "+e.message);
        alert(b.suspendu?"Compte réactivé":"Compte suspendu");
        charger();
      };
      w.appendChild(x);
      c.appendChild(w);
    });
    return true;
  }
  const charger2=charger;
  charger=async function(){await charger2();await suspension();};
  let n=0;
  const t=setInterval(async()=>{n++;if(await suspension()||n>12)clearInterval(t);},500);
})();
</script></body></html>
