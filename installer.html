<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Installer TAÏF Marchand</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14513c">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
  :root{--vert:#0b2d21;--or:#ffc21f;--texte:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(180deg,#185039 0%,#0c3729 55%,#092c20 100%);background-attachment:fixed;color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px 22px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .logo{width:88px;height:88px;border-radius:20px;margin:0 0 10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .marque{font-weight:800;font-size:1.15rem;color:var(--or);margin:0 0 18px}
  h1{font-size:1.7rem;line-height:1.2;margin:0 0 12px}
  .etape{font-size:1.25rem;line-height:1.45;margin:0 0 14px;max-width:360px}
  .etape b{color:var(--or)}
  .fin{font-size:1rem;line-height:1.45;max-width:340px;margin:8px 0 0;color:#cfe3d8}
  .btn{display:none;margin-top:10px;width:100%;max-width:340px;padding:16px;border:0;border-radius:999px;
    background:var(--or);color:#1b1500;font-weight:800;font-size:1.15rem}
  .btn.on{display:block}
  .copie{display:none;margin-top:14px;padding:14px 18px;border-radius:12px;border:2px solid var(--or);
    background:transparent;color:#fff;font-weight:700;font-size:1.05rem}
  .copie.on{display:inline-block}
  /* flèche fixe qui pointe le bouton du navigateur */
  #fleche{position:fixed;width:64px;height:64px;color:var(--or);display:none;z-index:5;
    animation:rebond 1s ease-in-out infinite}
  #fleche.on{display:block}
  #fleche.haut-droite{top:calc(env(safe-area-inset-top) + 8px);right:10px}
  #fleche.bas-centre{bottom:calc(env(safe-area-inset-bottom) + 8px);left:calc(50% - 32px);transform:rotate(180deg)}
  #fleche.bas-droite{bottom:calc(env(safe-area-inset-bottom) + 8px);right:10px;transform:rotate(180deg)}
  @keyframes rebond{0%,100%{margin-top:0}50%{margin-top:-10px}}
  #fleche.bas-centre,#fleche.bas-droite{animation-name:rebondBas}
  @keyframes rebondBas{0%,100%{margin-top:0}50%{margin-top:10px}}
  @media (prefers-reduced-motion:reduce){#fleche{animation:none}}
  :focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>

  <p class="marque">TAÏF Marchand</p>
  <h1 id="titre">Installe TAÏF Marchand</h1>
  <p class="etape" id="etape"></p>
  <button class="btn" id="btn-install" type="button">Installer maintenant</button>
  <button class="copie" id="btn-copie" type="button">Copier le lien</button>
  <p class="fin" id="fin"></p>

<script>
(function(){
  var ua=navigator.userAgent||"";
  var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  // Déjà installée : on ouvre directement l'application
  if(standalone){location.replace("/");return;}

  var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var chromeIos=/CriOS/i.test(ua);
  var samsung=/SamsungBrowser/i.test(ua);
  var inApp=/FBAN|FBAV|FB_IAB|Instagram|musical_ly|BytedanceWebview|TikTok|Snapchat|Line\//i.test(ua);

  var etape=document.getElementById("etape"),fin=document.getElementById("fin"),
      fl=document.getElementById("fleche"),btn=document.getElementById("btn-install"),
      cp=document.getElementById("btn-copie");

  function guide(html,pos,suite){etape.innerHTML=html;fl.className="on "+pos;fin.textContent=suite||"";}

  if(inApp){
    var nav=ios?"Safari":"Chrome";
    etape.innerHTML="Tu es dans une autre application. Copie le lien, puis colle-le dans <b>"+nav+"</b>.";
    fin.textContent="L’installation ne marche pas ici.";
    cp.className="copie on";
    cp.onclick=function(){
      var u=location.href.split("#")[0];
      function ok(){cp.textContent="Lien copié ✓";}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,function(){prompt("Copie ce lien :",u);});}
      else{prompt("Copie ce lien :",u);}
    };
  }else if(ios&&!chromeIos){
    guide("Appuie sur le bouton <b>Partager</b> en bas, puis choisis <b>« Sur l’écran d’accueil »</b> et <b>« Ajouter »</b>.","bas-centre",
      "Ensuite, ferme Safari et ouvre l’icône TAÏF sur ton écran. Si tu ne vois pas Partager, appuie sur ⋯ en bas.");
  }else if(ios&&chromeIos){
    guide("Appuie sur le bouton <b>Partager</b> en haut à droite, puis choisis <b>« Sur l’écran d’accueil »</b> et <b>« Ajouter »</b>.","haut-droite",
      "Ensuite, ouvre l’icône TAÏF sur ton écran.");
  }else if(samsung){
    guide("Appuie sur le menu <b>≡</b> en bas à droite, puis choisis <b>« Ajouter la page à »</b> et <b>« Écran d’accueil »</b>.","bas-droite",
      "Ensuite, ouvre l’icône TAÏF sur ton écran.");
  }else{
    guide("Appuie sur les <b>3 points ⋮</b> en haut à droite, puis choisis <b>« Installer l’application »</b>.","haut-droite",
      "Ensuite, ouvre l’icône TAÏF sur ton écran.");
    var dp=null;
    window.addEventListener("beforeinstallprompt",function(e){
      e.preventDefault();dp=e;
      etape.innerHTML="Appuie sur le bouton jaune pour installer l’application.";
      fl.className="";btn.className="btn on";
    });
    btn.onclick=function(){
      if(!dp)return;dp.prompt();
      dp.userChoice.then(function(){dp=null;btn.className="btn";});
    };
    window.addEventListener("appinstalled",function(){
      document.getElementById("titre").textContent="C’est installé ✓";
      etape.innerHTML="Ferme cette page et ouvre l’icône <b>TAÏF Marchand</b> sur ton écran.";
      fl.className="";btn.className="btn";fin.textContent="";
    });
  }
})();
</script>
